name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and verify formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q Calculator.py FidgetSpinner.py SolarSystem.py tests scripts

      - name: Run tests
        run: python -m pytest

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit complete development environment
        run: python -m pip_audit --local

      - name: Check repository hygiene
        run: python scripts/check_repository.py
